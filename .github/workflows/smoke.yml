name: Portfolio offline smoke test
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/smoke.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/smoke.yml
permissions:
  contents: read
concurrency:
  group: portfolio-offline-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format and static checks
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
      - name: Synthetic offline tests
        run: go test -race -count=1 ./...
      - name: Unconfigured diagnostic without provider calls
        env:
          WALLETS_JSON: '[]'
          RPC_CONFIG_JSON: '[]'
          ZERION_API_KEY: ''
          REPORT_RECIPIENT: ''
        run: go run ./cmd/portfolio
